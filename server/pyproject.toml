[project]
name = "modeldesk-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "pymysql>=1.1",
  "alembic>=1.14",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0.3",
  "tzdata>=2024.2",
  "pypdf>=7.0.1",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "python-pptx>=1.0.2",
  "pypdfium2>=5.15.2",
  "xlrd>=2.0.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "anyio>=4.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
